events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Route API requests to the FastAPI backend
        location /api/ {
            # This strips the "/api" prefix before sending to FastAPI
            rewrite ^/api/(.*) /$1 break;
            
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Route Static Image uploads (Banners)
        location /static/ {
            proxy_pass http://backend:8000/static/;
        }

        # 3. Route everything else to the Vite Frontend
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Required for Vite Hot Module Replacement (HMR) to work through Nginx
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}